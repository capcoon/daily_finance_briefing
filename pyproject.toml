[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-finance-briefing"
version = "0.1.0"
description = "Generate a daily HTML summary of major financial markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "finance-datareader>=0.9.90,<1",
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
  "pandas>=2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
daily-finance-briefing = "daily_finance_briefing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_finance_briefing = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
